# 1. AUTO-INSTALL TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# 2. GENERAL SETTINGS
set -g default-terminal "xterm-256color"
set-option -g xterm-keys on
set-window-option -g mode-keys vi

# Clipboard: copy via OSC 52 so it reaches the local clipboard through mosh/ssh.
# Ghostty presents as xterm-256color, whose terminfo lacks the clipboard (Ms)
# capability, so declare it explicitly.
set -s set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',xterm-ghostty:clipboard'
set -g status-style "fg=black,bg=#f4f0ec"
set-option -sg escape-time 10
set-option -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 3. KEYBINDINGS
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 4. PLUGIN DEFINITIONS
set -g @plugin 'tmux-plugins/tpm'

# 5. INITIALIZE TPM
run '~/.tmux/plugins/tpm/tpm'

# Window names
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{=20:#{b:pane_current_path}}'
